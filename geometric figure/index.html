<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>动态几何 · 动点轨迹 + 内切/外接圆 · 完整版</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            font-size: 13px;
            color: #202124;
            background: #f1f3f4;
            -webkit-user-select: none;
            user-select: none
        }

        button {
            font-family: inherit
        }

        #app {
            display: flex;
            height: 100vh;
            overflow: hidden
        }

        #toolbar {
            width: 54px;
            flex: none;
            background: #fff;
            border-right: 1px solid #e0e5ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 20;
            scrollbar-width: thin
        }

        #toolbar::-webkit-scrollbar {
            width: 4px
        }

        #toolbar::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 2px
        }

        .tool {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #5f6368;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex: none;
            transition: background .13s, color .13s, transform .08s;
            position: relative;
            margin: 1px 0
        }

        .tool:hover {
            background: #f1f3f4;
            color: #1a73e8
        }

        .tool:active {
            transform: scale(.92)
        }

        .tool.active {
            background: #e8f0fe;
            color: #1a73e8
        }

        .tool.anim {
            color: #d81b60
        }

        .tool.anim.active {
            background: #fce4ec;
            color: #c2185b
        }

        .tool.conic {
            color: #00838f
        }

        .tool.conic.active {
            background: #e0f2f1;
            color: #00695c
        }

        .tool svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none
        }

        .tool svg .f {
            fill: currentColor;
            stroke: none
        }

        .tool .tip {
            position: absolute;
            left: 52px;
            top: 50%;
            transform: translateY(-50%);
            background: #3c4043;
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity .12s;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .25)
        }

        .tool:hover .tip {
            opacity: 1
        }

        .sep {
            width: 26px;
            height: 1px;
            background: #e0e5ec;
            margin: 4px 0;
            flex: none
        }

        #canvasWrap {
            position: relative;
            flex: 1;
            min-width: 0;
            background: #fff;
            overflow: hidden
        }

        #cv {
            position: absolute;
            inset: 0;
            display: block;
            touch-action: none
        }

        #coords {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: rgba(255, 255, 255, .93);
            border: 1px solid #e0e5ec;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            color: #5f6368;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
            box-shadow: 0 1px 4px rgba(60, 64, 67, .08)
        }

        #hint {
            position: absolute;
            left: 10px;
            bottom: 10px;
            max-width: calc(100% - 260px);
            background: rgba(255, 255, 255, .93);
            border: 1px solid #e0e5ec;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12px;
            color: #5f6368;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 1px 4px rgba(60, 64, 67, .08)
        }

        #zoomCtrl {
            position: absolute;
            right: 10px;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        #zoomCtrl button {
            width: 32px;
            height: 32px;
            border: 1px solid #e0e5ec;
            background: rgba(255, 255, 255, .96);
            border-radius: 6px;
            color: #5f6368;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: grid;
            place-items: center;
            box-shadow: 0 1px 4px rgba(60, 64, 67, .08);
            transition: background .13s, color .13s
        }

        #zoomCtrl button:hover {
            background: #f1f3f4;
            color: #1a73e8
        }

        #playBar {
            position: absolute;
            left: 50%;
            top: 10px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, .97);
            border: 1px solid #e0e5ec;
            border-radius: 24px;
            padding: 6px 14px;
            box-shadow: 0 2px 12px rgba(60, 64, 67, .15);
            z-index: 10
        }

        #playBar button {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: #f1f3f4;
            color: #5f6368;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background .15s, color .15s, transform .08s
        }

        #playBar button:hover {
            background: #e8f0fe;
            color: #1a73e8
        }

        #playBar button:active {
            transform: scale(.9)
        }

        #playBar button.main {
            background: #1a73e8;
            color: #fff;
            width: 40px;
            height: 40px
        }

        #playBar button.main:hover {
            background: #1765cc
        }

        #playBar button.main.paused {
            background: #d81b60
        }

        #playBar button.main.paused:hover {
            background: #ad1457
        }

        #playBar svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            stroke: none
        }

        #playBar .lbl {
            font-size: 12px;
            color: #5f6368;
            padding: 0 4px;
            font-variant-numeric: tabular-nums
        }

        #playBar .spd {
            border: 1px solid #dadce0;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 11.5px;
            color: #5f6368;
            background: #fff;
            cursor: pointer;
            outline: none;
            font-family: inherit
        }

        #side {
            width: 294px;
            flex: none;
            background: #fff;
            border-left: 1px solid #e0e5ec;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 15
        }

        .optsBar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            border-bottom: 1px solid #f1f3f4;
            flex: none;
            flex-wrap: wrap
        }

        .optsBar label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            color: #5f6368;
            cursor: pointer
        }

        .optsBar input {
            accent-color: #1a73e8;
            cursor: pointer;
            margin: 0
        }

        .panelHead {
            padding: 9px 14px 7px;
            font-size: 12px;
            font-weight: 600;
            color: #5f6368;
            letter-spacing: .5px;
            border-bottom: 1px solid #f1f3f4;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .panelHead .mini {
            font-size: 11px;
            font-weight: 400;
            color: #80868b;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px
        }

        .panelHead .mini:hover {
            background: #f1f3f4;
            color: #1a73e8
        }

        #styleArea {
            flex: none;
            border-bottom: 1px solid #f1f3f4;
            padding: 10px 12px;
            display: none
        }

        #styleArea.show {
            display: block
        }

        .styleRow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px
        }

        .styleRow:last-child {
            margin-bottom: 0
        }

        .styleLbl {
            font-size: 11px;
            color: #80868b;
            width: 52px;
            flex: none
        }

        .swatches {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            flex: 1
        }

        .sw {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform .1s
        }

        .sw:hover {
            transform: scale(1.14)
        }

        .sw.on {
            border-color: #202124;
            box-shadow: 0 0 0 2px #fff inset
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 2px;
            background: #dadce0;
            outline: none;
            cursor: pointer
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #1a73e8;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .3)
        }

        .slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #1a73e8;
            cursor: pointer;
            border: 0
        }

        .chkRow {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #3c4043;
            cursor: pointer
        }

        .chkRow input {
            accent-color: #1a73e8;
            cursor: pointer;
            margin: 0
        }

        .btnMini {
            border: 1px solid #dadce0;
            background: #fff;
            color: #5f6368;
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 11.5px;
            cursor: pointer;
            transition: all .13s
        }

        .btnMini:hover {
            background: #e8f0fe;
            color: #1a73e8;
            border-color: #c5d8f7
        }

        .btnMini.on {
            background: #e8f0fe;
            color: #1a73e8;
            border-color: #1a73e8
        }

        #listArea {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            min-height: 60px
        }

        #listArea::-webkit-scrollbar {
            width: 6px
        }

        #listArea::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 3px
        }

        .objRow {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12.5px;
            line-height: 1.3;
            transition: background .1s
        }

        .objRow:hover {
            background: #f8f9fa
        }

        .objRow.sel {
            background: #e8f0fe
        }

        .objRow.hide {
            opacity: .42
        }

        .objDot {
            width: 16px;
            height: 16px;
            flex: none;
            display: grid;
            place-items: center;
            cursor: pointer
        }

        .objDot i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: block;
            position: relative
        }

        .objDot i.sq {
            border-radius: 2px
        }

        .objDot i.anim {
            box-shadow: 0 0 0 3px rgba(216, 27, 96, .22)
        }

        .objDot i.trail {
            box-shadow: 0 0 0 3px rgba(255, 109, 0, .22)
        }

        .objName {
            font-weight: 600;
            color: #202124;
            flex: none;
            min-width: 22px
        }

        .objDef {
            color: #5f6368;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1
        }

        .empty {
            text-align: center;
            color: #9aa0a6;
            font-size: 12.5px;
            padding: 32px 16px;
            line-height: 2
        }

        .empty b {
            display: block;
            font-size: 22px;
            margin-bottom: 6px;
            opacity: .35;
            font-weight: 400
        }

        #inputArea {
            flex: none;
            border-top: 1px solid #e0e5ec;
            padding: 8px 10px;
            background: #fafbfc
        }

        #cmdInput {
            width: 100%;
            border: 1px solid #dadce0;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 12.5px;
            font-family: "SF Mono", Consolas, monospace;
            outline: none;
            color: #202124;
            background: #fff;
            transition: border-color .15s, box-shadow .15s
        }

        #cmdInput:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, .12)
        }

        #cmdInput::placeholder {
            color: #9aa0a6
        }

        #cmdTips {
            font-size: 10.5px;
            color: #9aa0a6;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 46px;
            transform: translate(-50%, 14px);
            background: #323639;
            color: #fff;
            padding: 9px 20px;
            border-radius: 8px;
            font-size: 12.5px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .22s, transform .22s;
            z-index: 999;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .28);
            max-width: 76vw;
            text-align: center
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        @media (max-width:800px) {
            #side {
                width: 240px
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <aside id="toolbar">
            <button class="tool active" data-tool="move" title="移动"><svg viewBox="0 0 24 24">
                    <path class="f" d="M6.2 2.6l12.6 8.1-5.4.85 3.15 6.35-2.4 1.15-3.05-6.25-3.7 3.65z" />
                </svg><span class="tip">移动 / 拖动任意点 (1)</span></button>
            <button class="tool" data-tool="point" title="点"><svg viewBox="0 0 24 24">
                    <circle class="f" cx="12" cy="12" r="3.4" />
                    <circle cx="12" cy="12" r="7.4" opacity=".3" />
                </svg><span class="tip">自由点 (2)</span></button>
            <div class="sep"></div>
            <button class="tool anim" data-tool="animPoint" title="动点">
                <svg viewBox="0 0 24 24">
                    <circle cx="6" cy="12" r="3.4" />
                    <circle class="f" cx="17" cy="9" r="2.6" />
                    <path d="M9 12c2-3 5-4 8-3" stroke-dasharray="2.5 2.5" />
                    <path d="M14 6.5l3 .5-.5 3" />
                </svg>
                <span class="tip">★ 动点（点在路径上自动运动）(3)</span>
            </button>
            <button class="tool anim" data-tool="trace" title="轨迹追踪">
                <svg viewBox="0 0 24 24">
                    <path d="M3 18c2-9 7-13 10-7s6 2 8-3" stroke-dasharray="3 2" />
                    <circle class="f" cx="10" cy="9" r="2.4" />
                    <circle cx="16" cy="14" r="1.4" />
                    <circle cx="19" cy="9" r="1.1" />
                </svg>
                <span class="tip">★ 轨迹追踪（点击任意点开关）(4)</span>
            </button>
            <button class="tool anim" data-tool="locus" title="轨迹线">
                <svg viewBox="0 0 24 24">
                    <path d="M3 18c3-12 9-12 12 0" stroke-dasharray="3 3" />
                    <circle class="f" cx="9" cy="9" r="2" />
                    <circle class="f" cx="16" cy="15" r="1.5" />
                </svg>
                <span class="tip">★ 轨迹线（点 + 滑块）(5)</span>
            </button>
            <div class="sep"></div>
            <button class="tool" data-tool="segment" title="线段"><svg viewBox="0 0 24 24">
                    <line x1="6.6" y1="17.4" x2="17.4" y2="6.6" />
                    <circle class="f" cx="6.6" cy="17.4" r="2.3" />
                    <circle class="f" cx="17.4" cy="6.6" r="2.3" />
                </svg><span class="tip">线段 (6)</span></button>
            <button class="tool" data-tool="line" title="直线"><svg viewBox="0 0 24 24">
                    <line x1="2.6" y1="21" x2="21.4" y2="3" />
                    <circle class="f" cx="8" cy="15.6" r="2.1" />
                    <circle class="f" cx="16" cy="8.4" r="2.1" />
                </svg><span class="tip">直线 (7)</span></button>
            <button class="tool" data-tool="ray" title="射线"><svg viewBox="0 0 24 24">
                    <line x1="5" y1="19" x2="18.4" y2="5.6" />
                    <path d="M18.4 5.6l-1.1 4.3M18.4 5.6l-4.3 1.1" />
                    <circle class="f" cx="5" cy="19" r="2.3" />
                </svg><span class="tip">射线 (8)</span></button>
            <button class="tool" data-tool="vector" title="向量"><svg viewBox="0 0 24 24">
                    <line x1="5.5" y1="18.5" x2="17" y2="7" />
                    <path d="M18.6 5.4l-5.1 1.4M18.6 5.4l-1.4 5.1" />
                    <circle class="f" cx="5.5" cy="18.5" r="2" />
                </svg><span class="tip">向量 (9)</span></button>
            <button class="tool" data-tool="circle" title="圆"><svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8.2" />
                    <circle class="f" cx="12" cy="12" r="1.9" />
                    <circle class="f" cx="20.2" cy="12" r="1.7" />
                </svg><span class="tip">圆 (C)</span></button>
            <button class="tool" data-tool="polygon" title="多边形"><svg viewBox="0 0 24 24">
                    <polygon points="12,3.4 20.6,19.6 3.4,19.6" />
                </svg><span class="tip">多边形 (P)</span></button>
            <div class="sep"></div>
            <button class="tool conic" data-tool="circumcircle" title="外接圆">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" opacity=".55" />
                    <polygon points="12,4.5 19.5,17.5 4.5,17.5" />
                </svg>
                <span class="tip">★ 外接圆（点击多边形）(O)</span>
            </button>
            <button class="tool conic" data-tool="incircle" title="内切圆">
                <svg viewBox="0 0 24 24">
                    <polygon points="12,3 21,20 3,20" />
                    <circle cx="12" cy="14.5" r="5" fill="none" stroke="currentColor" />
                </svg>
                <span class="tip">★ 内切圆（点击三角形）(J)</span>
            </button>
            <div class="sep"></div>
            <button class="tool" data-tool="midpoint" title="中点"><svg viewBox="0 0 24 24">
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <circle class="f" cx="4" cy="12" r="2" />
                    <circle class="f" cx="20" cy="12" r="2" />
                    <circle class="f" cx="12" cy="12" r="2.6" />
                </svg><span class="tip">中点 (M)</span></button>
            <button class="tool" data-tool="nDivi" title="等分点"><svg viewBox="0 0 24 24">
                    <line x1="3" y1="18" x2="21" y2="18" />
                    <circle class="f" cx="3" cy="18" r="1.8" />
                    <circle class="f" cx="21" cy="18" r="1.8" />
                    <circle class="f" cx="9" cy="18" r="1.5" />
                    <circle class="f" cx="15" cy="18" r="1.5" />
                </svg><span class="tip">等分点 (N)</span></button>
            <button class="tool" data-tool="intersect" title="交点"><svg viewBox="0 0 24 24">
                    <circle cx="9" cy="12" r="6" />
                    <circle cx="15" cy="12" r="6" />
                    <circle class="f" cx="12" cy="6.9" r="1.5" />
                    <circle class="f" cx="12" cy="17.1" r="1.5" />
                </svg><span class="tip">交点 (I)</span></button>
            <div class="sep"></div>
            <button class="tool" data-tool="perpendicular" title="垂线"><svg viewBox="0 0 24 24">
                    <line x1="3" y1="18" x2="21" y2="18" />
                    <line x1="11" y1="3" x2="11" y2="21" />
                    <path d="M11 14h4v4" opacity=".55" />
                </svg><span class="tip">垂线 (Q)</span></button>
            <button class="tool" data-tool="parallel" title="平行线"><svg viewBox="0 0 24 24">
                    <line x1="3" y1="9" x2="21" y2="9" />
                    <line x1="3" y1="16" x2="21" y2="16" />
                </svg><span class="tip">平行线 (W)</span></button>
            <button class="tool" data-tool="perpBisector" title="垂直平分线"><svg viewBox="0 0 24 24">
                    <line x1="4" y1="16" x2="20" y2="16" />
                    <circle class="f" cx="4" cy="16" r="1.9" />
                    <circle class="f" cx="20" cy="16" r="1.9" />
                    <line x1="12" y1="3" x2="12" y2="21" opacity=".55" />
                </svg><span class="tip">垂直平分线 (E)</span></button>
            <button class="tool" data-tool="angleBisector" title="角平分线"><svg viewBox="0 0 24 24">
                    <line x1="4" y1="20" x2="20" y2="20" />
                    <line x1="4" y1="20" x2="19" y2="5" />
                    <path d="M4 20l9.5-5.4" opacity=".55" />
                </svg><span class="tip">角平分线 (R)</span></button>
            <div class="sep"></div>
            <button class="tool" data-tool="tangent" title="切线"><svg viewBox="0 0 24 24">
                    <circle cx="12" cy="14" r="7" />
                    <line x1="3" y1="7" x2="21" y2="7" />
                    <circle class="f" cx="12" cy="7" r="1.8" />
                </svg><span class="tip">切线 (T)</span></button>
            <button class="tool" data-tool="secant" title="割线"><svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8" />
                    <line x1="4" y1="8" x2="20" y2="16" />

    <script>
        "use strict";
        /* ==============================================================
           基础
           ============================================================== */
        const canvas = document.getElementById('cv');
        const ctx = canvas.getContext('2d');
        const wrap = document.getElementById('canvasWrap');
        const listArea = document.getElementById('listArea');
        const styleArea = document.getElementById('styleArea');
        const styleBody = document.getElementById('styleBody');
        const hintEl = document.getElementById('hint');
        const coordsEl = document.getElementById('coords');
        const toastEl = document.getElementById('toast');
        const cmdInput = document.getElementById('cmdInput');
        const objCountEl = document.getElementById('objCount');
        const spdLbl = document.getElementById('spdLbl');

        const DPR = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        let W = 0, H = 0;

        const COL = {
            point: '#1a73e8', line: '#0f9d58', circle: '#9c27b0',
            polygon: '#e8710a', conic: '#d81b60', func: '#00838f',
            slider: '#5f6368', tangent: '#00695c', locus: '#7b1fa2',
            derived: '#5f6368', angle: '#d93025', anim: '#d81b60',
            incircle: '#00695c', circumcircle: '#3949ab'
        };
        const SEL = '#ff6d00';
        const COLOR_POOL = ['#1a73e8', '#0f9d58', '#e8710a', '#9c27b0', '#d93025', '#00838f',
            '#5f6368', '#c2185b', '#3f51b5', '#827717', '#d81b60', '#00695c'];

        const view = { x: 0, y: 0, scale: 64 };
        const cfg = { grid: true, axes: true, labels: true, fade: true };

        let objects = [];
        let idSeq = 1;
        let currentTool = 'move';
        let selectedId = null;
        let hoverId = null;
        let pending = [];
        let dragState = null;
        let mouse = { sx: 0, sy: 0, wx: 0, wy: 0 };
        let spaceDown = false;

        const anim = { playing: true, speed: 1.0, direction: 1, frameId: null, lastTime: 0 };

        const undoStack = [], redoStack = [];
        const MAX_UNDO = 60;

        /* ==============================================================
           数学工具
           ============================================================== */
        const MFNS = {
            sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
            sin: Math.sin, cos: Math.cos, tan: Math.tan,
            asin: Math.asin, acos: Math.acos, atan: Math.atan, atan2: Math.atan2,
            sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
            log: Math.log, ln: Math.log, log10: Math.log10, log2: Math.log2,
            exp: Math.exp, floor: Math.floor, ceil: Math.ceil, round: Math.round,
            sign: Math.sign, min: Math.min, max: Math.max, pow: Math.pow
        };
        function compileFn(expr, vars) {
            if (!expr) return null;
            let code = String(expr).replace(/\^/g, '**');
            code = code.replace(/\bpi\b/gi, '(' + Math.PI + ')');
            const varSet = new Set(vars || []);
            for (const name of Object.keys(MFNS)) {
                if (varSet.has(name)) continue;
                code = code.replace(new RegExp('\\b' + name + '\\b', 'g'), 'F.' + name);
            }
            code = code.replace(/\be\b/g, '(' + Math.E + ')');
            try {
                const fn = new Function('F', ...vars, 'return (' + code + ');');
                const t = vars.map(() => 0.5);
                const r = fn(MFNS, ...t);
                if (typeof r !== 'number') return null;
                return (args) => fn(MFNS, ...args);
            } catch (e) { return null; }
        }
        function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
        function fmt(v, d) {
            d = d == null ? 2 : d;
            if (!isFinite(v)) return '未定义';
            if (Math.abs(v) < 1e-10) v = 0;
            let s = v.toFixed(d);
            if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
            return s === '-0' ? '0' : s;
        }
        function fmtAngle(rad) { return fmt(rad * 180 / Math.PI, 1) + '°'; }
        function s2w(sx, sy) { return [(sx - W / 2) / view.scale + view.x, view.y - (sy - H / 2) / view.scale]; }
        function w2s(x, y) { return [(x - view.x) * view.scale + W / 2, (view.y - y) * view.scale + H / 2]; }
        function segDistPx(p, a, b) {
            const dx = b[0] - a[0], dy = b[1] - a[1];
            const L2 = dx * dx + dy * dy;
            let t = L2 > 1e-9 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0;
            t = clamp(t, 0, 1);
            return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
        }
        function segDistPts(p, a, b) {
            const dx = b[0] - a[0], dy = b[1] - a[1];
            const L2 = dx * dx + dy * dy;
            let t = L2 > 1e-9 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0;
            t = clamp(t, 0, 1);
            return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
        }
        function lineDistPx(p, a, b) {
            const dx = b[0] - a[0], dy = b[1] - a[1];
            const L2 = dx * dx + dy * dy;
            if (L2 < 1e-9) return Math.hypot(p[0] - a[0], p[1] - a[1]);
            const t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2;
            return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
        }
        function gridStep() {
            const target = 78, raw = target / view.scale;
            const e = Math.floor(Math.log10(raw)), base = Math.pow(10, e);
            const m = raw / base;
            return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * base;
        }
        function lineLine(A, B, C, D) {
            const d1x = B.x - A.x, d1y = B.y - A.y, d2x = D.x - C.x, d2y = D.y - C.y;
            const den = d1x * d2y - d1y * d2x;
            if (Math.abs(den) < 1e-12) return [];
            const t = ((C.x - A.x) * d2y - (C.y - A.y) * d2x) / den;
            return [{ x: A.x + t * d1x, y: A.y + t * d1y }];
        }
        function lineCircle(A, B, C, r) {
            const dx = B.x - A.x, dy = B.y - A.y, fx = A.x - C.x, fy = A.y - C.y;
            const a = dx * dx + dy * dy;
            if (a < 1e-14) return [];
            const b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - r * r;
            let disc = b * b - 4 * a * c;
            if (disc < -1e-10) return [];
            if (disc < 0) disc = 0;
            const sq = Math.sqrt(disc);
            if (sq < 1e-10) {
                const t = -b / (2 * a);
                return [{ x: A.x + t * dx, y: A.y + t * dy }];
            }
            const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
            return [{ x: A.x + t1 * dx, y: A.y + t1 * dy }, { x: A.x + t2 * dx, y: A.y + t2 * dy }];
        }
        function circleCircle(c1, r1, c2, r2) {
            const dx = c2.x - c1.x, dy = c2.y - c1.y, d = Math.hypot(dx, dy);
            if (d < 1e-12) return [];
            if (d > r1 + r2 + 1e-10) return [];
            if (d < Math.abs(r1 - r2) - 1e-10) return [];
            const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
            let h2 = r1 * r1 - a * a;
            if (h2 < 0) h2 = 0;
            const h = Math.sqrt(h2);
            const xm = c1.x + a * dx / d, ym = c1.y + a * dy / d;
            if (h < 1e-10) return [{ x: xm, y: ym }];
            return [{ x: xm + h * dy / d, y: ym - h * dx / d }, { x: xm - h * dy / d, y: ym + h * dx / d }];
        }
        function angleAt(A, B, C) {
            const ux = A.x - B.x, uy = A.y - B.y;
            const vx = C.x - B.x, vy = C.y - B.y;
            const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
            if (lu < 1e-12 || lv < 1e-12) return 0;
            let cos = (ux * vx + uy * vy) / (lu * lv);
            cos = clamp(cos, -1, 1);
            const ang = Math.acos(cos);
            return (ux * vy - uy * vx) >= 0 ? ang : -ang;
        }
        function polyArea(pts) {
            let s = 0;
            for (let i = 0; i < pts.length; i++) {
                const a = pts[i], b = pts[(i + 1) % pts.length];
                s += a.x * b.y - b.x * a.y;
            }
            return Math.abs(s) / 2;
        }
        function hexA(hex, a) {
            if (!hex || hex[0] !== '#') return hex;
            let h = hex.slice(1);
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const n = parseInt(h, 16);
            return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
        }
        function getObj(id) { for (const o of objects) if (o.id === id) return o; return null; }
        function getPt(id) { const o = getObj(id); return o && o.type === 'point' ? o : null; }

        /* ★ 计算三角形内心（内切圆圆心）和半径 */
        function computeIncircle(pts) {
            if (pts.length < 3) return null;
            const A = pts[0], B = pts[1], C = pts[2];
            const a = Math.hypot(B.x - C.x, B.y - C.y);
            const b = Math.hypot(A.x - C.x, A.y - C.y);
            const c = Math.hypot(A.x - B.x, A.y - B.y);
            const sum = a + b + c;
            if (sum < 1e-9) return null;
            const area = Math.abs((B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y)) / 2;
            if (area < 1e-9) return null;
            // 内心坐标 = (a·A + b·B + c·C) / (a+b+c)
            const x = (a * A.x + b * B.x + c * C.x) / sum;
            const y = (a * A.y + b * B.y + c * C.y) / sum;
            // 半径 = 2·面积 / 周长
            const r = 2 * area / sum;
            return { x, y, r };
        }

        /* ★ 计算三点外接圆圆心和半径 */
        function computeCircumcircle(A, B, C) {
            const d = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
            if (Math.abs(d) < 1e-9) return null;
            const A2 = A.x * A.x + A.y * A.y;
            const B2 = B.x * B.x + B.y * B.y;
            const C2 = C.x * C.x + C.y * C.y;
            const x = (A2 * (B.y - C.y) + B2 * (C.y - A.y) + C2 * (A.y - B.y)) / d;
            const y = (A2 * (C.x - B.x) + B2 * (A.x - C.x) + C2 * (B.x - A.x)) / d;
            const r = Math.hypot(x - A.x, y - A.y);
            return { x, y, r };
        }

        /* ★ 反求路径上离世界坐标最近的参数 t（用于拖动动点） */
        function closestTOnPath(path, wx, wy) {
            if (!path || path.valid === false) return null;
            if (path.type === 'circle' && path._c) {
                const ang = Math.atan2(wy - path._c.y, wx - path._c.x);
                return (ang / (Math.PI * 2) + 1) % 1;
            }
            if ((path.type === 'segment' || path.type === 'vector') && path._p1) {
                const dx = path._p2.x - path._p1.x, dy = path._p2.y - path._p1.y;
                const L2 = dx * dx + dy * dy;
                if (L2 < 1e-12) return 0;
                return clamp(((wx - path._p1.x) * dx + (wy - path._p1.y) * dy) / L2, 0, 1);
            }
            if (path.type === 'line' && path._p1) {
                const dx = path._p2.x - path._p1.x, dy = path._p2.y - path._p1.y;
                const L2 = dx * dx + dy * dy;
                if (L2 < 1e-12) return 0.5;
                const t = ((wx - path._p1.x) * dx + (wy - path._p1.y) * dy) / L2;
                return clamp((t + 1.5) / 3, 0, 1);
            }
            if (path.type === 'ray' && path._p1) {
                const dx = path._p2.x - path._p1.x, dy = path._p2.y - path._p1.y;
                const L2 = dx * dx + dy * dy;
                if (L2 < 1e-12) return 0;
                const t = ((wx - path._p1.x) * dx + (wy - path._p1.y) * dy) / L2;
                return clamp(t / 2.5, 0, 1);
            }
            if (path.type === 'func' && path._fn) {
                const [x0] = s2w(0, 0);
                const [x1] = s2w(W, 0);
                return clamp((wx - x0) / (x1 - x0), 0, 1);
            }
            if (path._pts && path._pts.length) {
                const N = path._pts.length;
                let best = 0, bd = Infinity;
                for (let i = 0; i < N; i++) {
                    const a = path._pts[i], b = path._pts[(i + 1) % N];
                    const d = segDistPts([wx, wy], [a.x, a.y], [b.x, b.y]);
                    if (d < bd) {
                        bd = d;
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const L2 = dx * dx + dy * dy;
                        let tt = L2 > 1e-12 ? ((wx - a.x) * dx + (wy - a.y) * dy) / L2 : 0;
                        tt = clamp(tt, 0, 1);
                        best = (i + tt) / N;
                    }
                }
                return best;
            }
            return null;
        }

        /* ==============================================================
           命名
           ============================================================== */
        function usedNames() { const s = new Set(); for (const o of objects) s.add(o.name); return s; }
        function autoName(type) {
            const used = usedNames();
            if (type === 'point') {
                const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                for (const ch of L) if (!used.has(ch)) return ch;
                for (let i = 1; i < 200; i++)
                    for (const ch of L) { const n = ch + i; if (!used.has(n)) return n; }
            }
            const greek = 'αβγδεζηθικλμνξοπρστυφχψω';
            if (type === 'angle') {
                for (const ch of greek) if (!used.has(ch)) return ch;
            }
            const prefix = {
                segment: 's', line: 'l', ray: 'r', vector: 'v', secant: 'sec',
                circle: 'c', polygon: 'poly', ellipse: 'e', parabola: 'par',
                hyperbola: 'h', func: 'f', slider: 't', tangent: 'tan',
                locus: 'loc', distance: 'd', text: 'txt', perpendicular: 'perp',
                parallel: 'parl', perpBisector: 'pm', angleBisector: 'ab',
                incircle: 'inc', circumcircle: 'cc'
            }[type] || 'o';
            for (let i = 1; i < 999; i++) {
                const n = prefix + i;
                if (!used.has(n)) return n;
            }
            return prefix + (idSeq++);
        }
        function findPointNear(sx, sy, r) {
            r = r || 14;
            let best = null, bd = r;
            for (const o of objects) {
                if (!o.visible || o.type !== 'point' || o.valid === false) continue;
                const [px, py] = w2s(o.x, o.y);
                const d = Math.hypot(px - sx, py - sy);

            if (isLine(o1) && isLine(o2)) return lineLine(o1._p1, o1._p2, o2._p1, o2._p2);
            if (isLine(o1) && isCirc(o2)) return lineCircle(o1._p1, o1._p2, o2._c, o2._r);
            if (isCirc(o1) && isLine(o2)) return lineCircle(o2._p1, o2._p2, o1._c, o1._r);
            if (isCirc(o1) && isCirc(o2)) return circleCircle(o1._c, o1._r, o2._c, o2._r);
            return [];
        }

        function evaluateAll() {
            const order = topoOrder();
            for (const o of order) {
                try { computeObj(o); } catch (e) { o.valid = false; }
            }
        }

        /* ★ 统一的轨迹记录：任何位置变化后调用，所有开启追踪的点都会记录 */
        function recordAllTrails() {
            for (const o of objects) {
                if (o.type !== 'point' || !o.showTrail || o.valid === false) continue;
                const last = o.trail[o.trail.length - 1];
                const minDist = 0.004;
                if (!last || Math.abs(last.x - o.x) > minDist || Math.abs(last.y - o.y) > minDist) {
                    o.trail.push({ x: o.x, y: o.y });
                    const cap = o.trailMax || 1200;
                    if (o.trail.length > cap) o.trail.shift();
                }
            }
        }

        /* ★ 动画引擎：只推进"带路径的动点"的 t；从动点靠 evaluate 更新；
           最后统一 recordAllTrails，从动点轨迹因此被记录 */
        function tickAnimations(dt) {
            let moved = false;
            for (const o of objects) {
                if (o.type !== 'point' || !o.animating || o.pathId == null) continue;
                if (o.direction === 2) {
                    o.t += o.bounceDir * (o.animSpeed * anim.speed * dt * 0.28);
                    if (o.t > 1) { o.t = 1; o.bounceDir = -1; }
                    if (o.t < 0) { o.t = 0; o.bounceDir = 1; }
                } else {
                    o.t += o.animSpeed * anim.speed * dt * 0.28 * o.direction;
                    if (o.t > 1) o.t -= 1;
                    if (o.t < 0) o.t += 1;
                }
                computeObj(o);
                moved = true;
            }
            if (moved) {
                const order = topoOrder();
                for (const o of order) {
                    if (o.type === 'point' && o.animating && o.pathId != null) continue;
                    try { computeObj(o); } catch (e) { }
                }
                recordAllTrails();
            }
            return moved;
        }

        function startAnimLoop() {
            if (anim.frameId) return;
            let last = performance.now();
            function loop(now) {
                const dt = Math.min(0.1, (now - last) / 1000);
                last = now;
                if (anim.playing) {
                    const moved = tickAnimations(dt);
                    if (moved) draw();
                }
                anim.frameId = requestAnimationFrame(loop);
            }
            anim.frameId = requestAnimationFrame(loop);
            anim.lastTime = last;
        }

        /* ==============================================================
           绘制
           ============================================================== */
        function resize() {
            const r = wrap.getBoundingClientRect();
            W = Math.max(1, Math.round(r.width));
            H = Math.max(1, Math.round(r.height));
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            evaluateAll();
            draw();
        }
        function drawGrid() {
            const step = gridStep();
            const [x0, y0] = s2w(0, H), [x1, y1] = s2w(W, 0);
            const i0 = Math.floor(x0 / step) - 1, i1 = Math.ceil(x1 / step) + 1;
            const j0 = Math.floor(y0 / step) - 1, j1 = Math.ceil(y1 / step) + 1;
            ctx.save();
            ctx.lineWidth = 1;
            const minorP = [], majorP = [];
            for (let i = i0; i <= i1; i++) {
                const sx = Math.round(w2s(i * step, 0)[0]) + 0.5;
                (i % 5 === 0 ? majorP : minorP).push(['v', sx]);
            }
            for (let j = j0; j <= j1; j++) {
                const sy = Math.round(w2s(0, j * step)[1]) + 0.5;
                (j % 5 === 0 ? majorP : minorP).push(['h', sy]);
            }
            ctx.strokeStyle = '#f2f5fa';
            ctx.beginPath();
            for (const [d, p] of minorP) {
                if (d === 'v') { ctx.moveTo(p, 0); ctx.lineTo(p, H); }
                else { ctx.moveTo(0, p); ctx.lineTo(W, p); }
            }
            ctx.stroke();
            ctx.strokeStyle = '#e3e8ef';
            ctx.beginPath();
            for (const [d, p] of majorP) {
                if (d === 'v') { ctx.moveTo(p, 0); ctx.lineTo(p, H); }
                else { ctx.moveTo(0, p); ctx.lineTo(W, p); }
            }
            ctx.stroke();
            ctx.restore();
        }
        function drawAxes() {
            const [ox, oy] = w2s(0, 0);
            ctx.save();
            ctx.strokeStyle = '#5f6368'; ctx.fillStyle = '#5f6368'; ctx.lineWidth = 1.4;
            if (oy > -50 && oy < H + 50) {
                ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W - 6, oy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(W - 6, oy); ctx.lineTo(W - 15, oy - 5); ctx.lineTo(W - 15, oy + 5);
                ctx.closePath(); ctx.fill();
            }
            if (ox > -50 && ox < W + 50) {
                ctx.beginPath(); ctx.moveTo(ox, H); ctx.lineTo(ox, 6); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(ox, 6); ctx.lineTo(ox - 5, 15); ctx.lineTo(ox + 5, 15);
                ctx.closePath(); ctx.fill();
            }
            const step = gridStep();
            if (step * view.scale >= 42) {
                ctx.font = '11px system-ui,sans-serif';
                ctx.fillStyle = '#80868b';
                ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                const ly = clamp(oy + 5, 3, H - 16);
                const [x0] = s2w(0, 0), [x1] = s2w(W, 0);
                for (let i = Math.floor(x0 / step) - 1; i <= Math.ceil(x1 / step) + 1; i++) {
                    if (i === 0) continue;
                    const sx = w2s(i * step, 0)[0];
                    if (sx < 18 || sx > W - 18) continue;
                    ctx.fillText(fmt(i * step), sx, ly);
                }
                ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                const lx = clamp(ox - 7, 24, W - 4);
                const [, y0] = s2w(0, H), [, y1] = s2w(0, 0);
                for (let j = Math.floor(y0 / step) - 1; j <= Math.ceil(y1 / step) + 1; j++) {
                    if (j === 0) continue;
                    const sy = w2s(0, j * step)[1];
                    if (sy < 12 || sy > H - 12) continue;
                    ctx.fillText(fmt(j * step), lx, sy);
                }
            }
            ctx.restore();
        }
        function isSel(o) { return selectedId === o.id; }
        function isHov(o) { return hoverId === o.id; }
        function strokeCol(o, base) {
            if (isSel(o)) return SEL;
            if (isHov(o)) return '#1a73e8';
            return base || o.color;
        }
        function lineW(o, base) {
            const w = base || o.width || 2;

        }
        function labelText(str, x, y, color, sel, size) {
            ctx.save();

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 3.4;
            ctx.strokeStyle = 'rgba(255,255,255,.94)';
            ctx.strokeText(str, x, y);
            ctx.fillStyle = sel ? '#e65100' : (color || '#3c4043');
            ctx.fillText(str, x, y);
            ctx.restore();
        }

        function drawTrails() {
            for (const o of objects) {
                if (o.type !== 'point' || !o.showTrail || !o.trail || o.trail.length < 2) continue;
                const N = o.trail.length;
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                const segs = Math.min(N - 1, 500);
                const start = N - 1 - segs;
                for (let i = 0; i < segs; i++) {
                    const p1 = o.trail[start + i];
                    const p2 = o.trail[start + i + 1];
                    const a = cfg.fade ? (i / segs) * 0.85 + 0.05 : 0.72;
                    const [x1, y1] = w2s(p1.x, p1.y);
                    const [x2, y2] = w2s(p2.x, p2.y);
                    ctx.strokeStyle = hexA(isSel(o) ? SEL : o.color, a);
                    ctx.lineWidth = cfg.fade ? 1 + (i / segs) * 2.2 : 2.2;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        function drawPoint(o) {
            const [x, y] = w2s(o.x, o.y);
            if (x < -60 || x > W + 60 || y < -60 || y > H + 60) return;
            const sel = isSel(o), hov = isHov(o);
            const r = o.size || 5;

            if (o.animating) {
                ctx.save();
                const t = performance.now() / 1000;
                const pulse = 1 + 0.18 * Math.sin(t * 3.5);
                ctx.beginPath();
                ctx.arc(x, y, (r + 8) * pulse, 0, Math.PI * 2);
                ctx.strokeStyle = hexA(o.color, 0.55);
                ctx.lineWidth = 1.6;
                ctx.stroke();
                ctx.restore();
            } else if (o.showTrail && o.trail && o.trail.length > 2) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, r + 6, 0, Math.PI * 2);
                ctx.strokeStyle = hexA(o.color, 0.32);
                ctx.lineWidth = 1.4;
                ctx.stroke();
                ctx.restore();
            }

            if (sel || hov) {
                ctx.beginPath();
                ctx.arc(x, y, r + 7, 0, Math.PI * 2);
                ctx.fillStyle = sel ? 'rgba(255,109,0,.18)' : 'rgba(26,115,232,.12)';
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.lineWidth = 2.3;
            ctx.strokeStyle = sel ? SEL : (hov ? '#1a73e8' : o.color);
            ctx.stroke();

            if (cfg.labels && o.labelVisible !== false) {
                ctx.font = '600 13px "PingFang SC",system-ui,sans-serif';
                ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)';
                const tx = x + r + 4, ty = y - r - 2;
                ctx.strokeText(o.name, tx, ty);
                ctx.fillStyle = sel ? '#e65100' : o.color;
                ctx.fillText(o.name, tx, ty);
            }
        }

        function drawStraight(o) {
            if (!o._p1 || !o._p2) return;
            let [x1, y1] = w2s(o._p1.x, o._p1.y);
            let [x2, y2] = w2s(o._p2.x, o._p2.y);
            const dx = x2 - x1, dy = y2 - y1;
            const L = Math.hypot(dx, dy);
            if (L < 1e-6) return;
            const K = 6000 / L;
            if (o.type === 'line' || o.type === 'perpendicular' || o.type === 'parallel' ||
                o.type === 'perpBisector' || o.type === 'angleBisector' || o.type === 'tangent') {
                x1 -= dx * K; y1 -= dy * K; x2 += dx * K; y2 += dy * K;
            } else if (o.type === 'ray') {
                x2 += dx * K; y2 += dy * K;
            }
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineWidth = lineW(o);
            ctx.strokeStyle = strokeCol(o);
            if (o.type === 'secant' || o.type === 'tangent') {
                ctx.setLineDash(o.type === 'secant' ? [9, 4] : []);
            }
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.restore();

            if (o.type === 'vector') {
                const ang = Math.atan2(y2 - y1, x2 - x1);
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - 12 * Math.cos(ang - 0.42), y2 - 12 * Math.sin(ang - 0.42));
                ctx.lineTo(x2 - 12 * Math.cos(ang + 0.42), y2 - 12 * Math.sin(ang + 0.42));
                ctx.closePath();
                ctx.fillStyle = strokeCol(o); ctx.fill();
                ctx.restore();
            }
            if (cfg.labels && o.labelVisible !== false && (o.type === 'segment' || o.type === 'secant' ||
                o.type === 'tangent' || o.type === 'line' || o.type === 'vector')) {
                const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
                labelText(o.name, mx, my, o.color, isSel(o));
            }
        }
        function drawCircle(o) {
            if (!o._c) return;
            const [cx, cy] = w2s(o._c.x, o._c.y);
            const r = o._r * view.scale;
            if (r < 0.4) return;
            ctx.save();
            ctx.lineWidth = lineW(o);
            ctx.strokeStyle = strokeCol(o);
            if (o.derived) {
                ctx.setLineDash([7, 4]);
            }
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
            if (cfg.labels && o.labelVisible !== false) {
                const ang = -Math.PI / 4;
                labelText(o.name + (o.derived === 'incircle' ? ' (内切)' : o.derived === 'circumcircle' ? ' (外接)' : ''),
                    cx + r * Math.cos(ang), cy + r * Math.sin(ang), o.color, isSel(o));
            }
        }
        function drawPolygon(o) {
            if (!o._pts || o._pts.length < 3) return;
            const pts = o._pts.map(p => w2s(p.x, p.y));
            ctx.save();
            ctx.beginPath();
            pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
            ctx.closePath();
            const col = isSel(o) ? SEL : o.color;
            ctx.fillStyle = hexA(col, 0.11); ctx.fill();
            ctx.lineWidth = lineW(o); ctx.lineJoin = 'round';
            ctx.strokeStyle = col; ctx.stroke();
            ctx.restore();
            if (cfg.labels && o.labelVisible !== false) {
                const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
                const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
                labelText(o.name + ' = ' + fmt(polyArea(o._pts)), cx, cy, o.color, isSel(o));
            }
        }
        function drawCurve(o) {
            if (!o._pts || !o._pts.length) return;
            ctx.save();
            ctx.lineWidth = lineW(o);
            ctx.strokeStyle = strokeCol(o);
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.beginPath();
            let started = false;
            for (const p of o._pts) {
                const [sx, sy] = w2s(p.x, p.y);
                if (!isFinite(sx) || !isFinite(sy)) { started = false; continue; }

            if (o._pts2 && o._pts2.length) {

        function drawSlider(o) {

        function drawPending() {
            if (!pending.length) return;
            const [mx, my] = [mouse.sx, mouse.sy];

            ctx.setLineDash([6, 5]);
            ctx.strokeStyle = 'rgba(26,115,232,.8)';
            ctx.lineWidth = 1.6;
            const t = currentTool;
            if (t === 'polygon') {
                const pts = pending.filter(p => p.type === 'point');
                if (pts.length) {
                    ctx.beginPath();
                    pts.forEach((p, i) => {
                        const [x, y] = w2s(p.x, p.y);
                        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);

                    ctx.lineTo(mx, my);

            } else {
                const last = pending[pending.length - 1];
                if (last && last.type === 'point') {
                    const [x, y] = w2s(last.x, last.y);
                    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(mx, my); ctx.stroke();
                }
            }
            ctx.restore();
        }

        function draw() {
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            ctx.clearRect(0, 0, W, H);
            if (cfg.grid) drawGrid();
            if (cfg.axes) drawAxes();

            const vis = objects.filter(o => o.visible && o.valid !== false);
            for (const o of vis) if (o.type === 'polygon') drawPolygon(o);
            for (const o of vis) if (o.type === 'circle') drawCircle(o);
            for (const o of vis) if (o.type === 'ellipse' || o.type === 'parabola' ||
                o.type === 'hyperbola' || o.type === 'func') drawCurve(o);
            for (const o of vis) if (o.type === 'locus') drawLocus(o);
            for (const o of vis) if (['segment', 'line', 'ray', 'vector', 'secant',
                'perpendicular', 'parallel', 'perpBisector',
                'angleBisector', 'tangent'].includes(o.type)) drawStraight(o);
            for (const o of vis) if (o.type === 'angle') drawAngle(o);
            for (const o of vis) if (o.type === 'distance') drawDistance(o);
            for (const o of vis) if (o.type === 'slider') drawSlider(o);

            drawTrails();
            drawPending();

            for (const o of vis) if (o.type === 'point') drawPoint(o);
            for (const o of vis) if (o.type === 'text') drawText(o);
        }

        /* ==============================================================
           命中
           ============================================================== */
        function hitTest(sx, sy) {
            for (const o of objects) {
                if (!o.visible || o.type !== 'slider') continue;
                if (sx > o.x - 12 && sx < o.x + 192 && sy > o.y - 18 && sy < o.y + 28) return o;
            }
            let best = null, bestD = 15;
            for (const o of objects) {
                if (!o.visible || o.type !== 'point' || o.valid === false) continue;
                const [px, py] = w2s(o.x, o.y);
                const d = Math.hypot(px - sx, py - sy);
                if (d < bestD) { bestD = d; best = o; }
            }
            if (best) return best;
            for (const o of objects) {
                if (!o.visible || o.type !== 'text' || o._x == null) continue;
                const [px, py] = w2s(o._x, o._y);
                if (sx > px && sx < px + 240 && Math.abs(sy - py) < 18) return o;
            }
            bestD = 9;
            for (const o of objects) {
                if (!o.visible || o.valid === false) continue;
                if (['point', 'text', 'slider'].includes(o.type)) continue;
                let d = Infinity;
                if (o.type === 'circle' && o._c) {
                    const [cx, cy] = w2s(o._c.x, o._c.y);
                    d = Math.abs(Math.hypot(cx - sx, cy - sy) - o._r * view.scale);
                } else if (o._p1 && o._p2) {
                    const a = w2s(o._p1.x, o._p1.y), b = w2s(o._p2.x, o._p2.y);
                    if (o.type === 'segment' || o.type === 'vector' || o.type === 'secant') {
                        d = segDistPx([sx, sy], a, b);
                    } else if (o.type === 'ray') {
                        const dx = b[0] - a[0], dy = b[1] - a[1];
                        const t = ((sx - a[0]) * dx + (sy - a[1]) * dy) / (dx * dx + dy * dy || 1);
                        d = t >= 0 ? lineDistPx([sx, sy], a, b) : Math.hypot(sx - a[0], sy - a[1]);
                    } else d = lineDistPx([sx, sy], a, b);
                } else if (o.type === 'polygon' && o._pts) {
                    const pts = o._pts.map(p => w2s(p.x, p.y));
                    for (let i = 0; i < pts.length; i++)
                        d = Math.min(d, segDistPx([sx, sy], pts[i], pts[(i + 1) % pts.length]));
                } else if (o._pts) {
                    for (const p of o._pts) {
                        const [px, py] = w2s(p.x, p.y);
                        const dd = Math.hypot(px - sx, py - sy);
                        if (dd < d) d = dd;
                    }
                    if (o._pts2) for (const p of o._pts2) {
                        const [px, py] = w2s(p.x, p.y);
                        const dd = Math.hypot(px - sx, py - sy);
                        if (dd < d) d = dd;
                    }
                } else if (o.type === 'angle' && o._vertex) {
                    const [vx, vy] = w2s(o._vertex.x, o._vertex.y);
                    d = Math.abs(Math.hypot(sx - vx, sy - vy) - Math.min(72, o._r * view.scale));
                } else if (o.type === 'distance' && o._A) {
                    const a = w2s(o._A.x, o._A.y), b = w2s(o._B.x, o._B.y);
                    d = segDistPx([sx, sy], a, b);
                } else if (o.type === 'locus' && o._samples) {
                    for (let i = 0; i < o._samples.length - 1; i++) {
                        const a = w2s(o._samples[i].x, o._samples[i].y);
                        const b = w2s(o._samples[i + 1].x, o._samples[i + 1].y);
                        d = Math.min(d, segDistPx([sx, sy], a, b));
                    }
                }
                if (d < bestD) { bestD = d; best = o; }
            }
            return best;
        }

        /* ==============================================================
           撤销 / 重做
           ============================================================== */
        function serialize() {
            const cloned = objects.map(o => {
                const c = Object.assign({}, o);
                if (c.trail && c.trail.length > 150) c.trail = c.trail.slice(-150);
                return c;
            });
            return JSON.stringify({ objects: cloned, idSeq, selectedId });
        }
        function pushUndo() {
            undoStack.push(serialize());
            if (undoStack.length > MAX_UNDO) undoStack.shift();
            redoStack.length = 0;
        }
        function restore(str) {
            try {
                const d = JSON.parse(str);
                objects = (d.objects || []).map(o => {
                    if (!o.trail) o.trail = [];
                    if (o.bounceDir == null) o.bounceDir = 1;
                    return o;
                });
                idSeq = d.idSeq || (objects.reduce((m, o) => Math.max(m, o.id), 0) + 1);
                selectedId = d.selectedId || null;
                pending = []; hoverId = null; dragState = null;
                evaluateAll();
                updatePanel();
                draw();
            } catch (e) { }
        }
        function undo() { if (!undoStack.length) return; redoStack.push(serialize()); restore(undoStack.pop()); toast('已撤销'); }
        function redo() { if (!redoStack.length) return; undoStack.push(serialize()); restore(redoStack.pop()); toast('已重做'); }

        /* ==============================================================
           对象管理
           ============================================================== */
        function removeObject(id) {
            const toDel = new Set([id]);
            let changed = true;
            while (changed) {
                changed = false;
                for (const o of objects) {
                    if (toDel.has(o.id)) continue;
                    for (const p of refsOf(o)) {
                        if (toDel.has(p)) { toDel.add(o.id); changed = true; break; }
                    }
                }
            }
            objects = objects.filter(o => !toDel.has(o.id));
            if (selectedId != null && toDel.has(selectedId)) selectedId = null;
            if (hoverId != null && toDel.has(hoverId)) hoverId = null;
            pending = pending.filter(o => !toDel.has(o.id));
            evaluateAll(); updatePanel(); draw();
        }
        function clearAll() {
            if (!objects.length) return;
            pushUndo();
            objects = []; selectedId = null; hoverId = null; pending = []; idSeq = 1;
            updatePanel(); draw(); toast('已清空画布');
        }

        /* ==============================================================
           工具
           ============================================================== */
        const HINTS = {
