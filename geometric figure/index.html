        function setTool(name) {
            currentTool = name;
            pending = [];
            document.querySelectorAll('.tool[data-tool]').forEach(b => {
                b.classList.toggle('active', b.dataset.tool === name);
            });
            canvas.style.cursor = (name === 'move') ? 'default' : 'crosshair';
            hintEl.textContent = HINTS[name] || '';
            draw();
        }

        function toolPoint(m) {
            const near = findPointNear(m.sx, m.sy);
            if (near) { selectedId = near.id; updatePanel(); draw(); return; }
            pushUndo();
            const [wx, wy] = s2w(m.sx, m.sy);
            const p = makePoint(wx, wy);
            selectedId = p.id;
            evaluateAll(); updatePanel(); draw();
        }

        function toolAnimPoint(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit) { toast('请点击一条路径（圆/线段/直线/曲线等）'); return; }
            const pathTypes = ['circle', 'segment', 'line', 'ray', 'vector', 'func', 'ellipse',
                'parabola', 'hyperbola', 'polygon'];
            if (!pathTypes.includes(hit.type)) { toast('该对象不是有效路径'); return; }
            pushUndo();
            const p = makePoint(0, 0, {
                free: false, pathId: hit.id, t: 0,
                animating: true, animSpeed: 1, direction: 1,
                showTrail: true, color: COL.anim, size: 5.5
            });
            p.name = autoName('point');
            selectedId = p.id;
            evaluateAll(); updatePanel(); draw();
            toast('动点 ' + p.name + ' 已创建，正沿 ' + hit.name + ' 运动，轨迹已记录');
        }

        function toolTrace(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit) { toast('请点击一个点'); return; }
            if (hit.type !== 'point') { toast('请点击点对象'); return; }
            pushUndo();
            hit.showTrail = !hit.showTrail;
            if (!hit.showTrail) hit.trail = [];
            updatePanel(); draw();
            toast(hit.name + (hit.showTrail ? ' 已开启轨迹追踪' : ' 已关闭轨迹追踪'));
        }

        function toolLocus(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit) { toast('请点击对象'); return; }
            if (pending.length === 0) {
                if (hit.type !== 'point') { toast('第一个点击请选择一个点（动点或从动点）'); return; }
                pending.push(hit);
                evaluateAll(); draw();
                return;
            }
            if (hit.type !== 'slider') { toast('第二个点击请选择一个滑块'); return; }
            pushUndo();
            const P = pending[0];
            const loc = makeGeneric('locus', { point: P.id, driver: hit.id }, { color: COL.locus });
            computeLocus(loc);
            selectedId = loc.id;
            pending = [];
            evaluateAll(); updatePanel(); draw();
            toast('轨迹线 ' + loc.name + ' 已创建 · ' + (loc._samples ? loc._samples.length : 0) + ' 采样点');
        }

        function toolTwoPoints(m, type) {
            if (pending.length === 0) {
                const p = getOrCreatePoint(m.sx, m.sy);
                pending.push(p);
                evaluateAll(); updatePanel(); draw();
                return;
            }
            const p1 = pending[0];
            const p2 = getOrCreatePoint(m.sx, m.sy);
            if (p1 === p2) { toast('两点不能重合'); return; }
            pushUndo();
            if (type === 'circle') makeCircle(p1, p2);
            else if (type === 'midpoint') {
                const mp = makePoint(0, 0, { free: false, parents: [p1.id, p2.id], rule: 'midpoint', color: '#d81b60' });
                mp.showTrail = true;
                selectedId = mp.id;
            } else if (type === 'perpBisector') {
                makeGeneric('perpBisector', { a: p1.id, b: p2.id }, { color: COL.derived });
            } else if (type === 'distance') {
                makeGeneric('distance', { a: p1.id, b: p2.id }, { color: COL.derived });
            } else if (type === 'nDivi') {
                const n = parseInt(prompt('等分数 n =', '4'), 10);
                if (isNaN(n) || n < 2) { toast('请输入不小于2的整数'); return; }
                for (let i = 1; i < n; i++) {
                    const t = i / n;
                    const mp = makePoint(0, 0, {
                        free: false, parents: [p1.id, p2.id], rule: 'expr',
                        color: '#d81b60', name: autoName('point')
                    });
                    mp._fx = () => p1.x + (p2.x - p1.x) * t;
                    mp._fy = () => p1.y + (p2.y - p1.y) * t;
                }
                toast('已创建 ' + (n - 1) + ' 个等分点');
            } else if (type === 'secant') {
                makeLine('secant', p1, p2);
            } else {
                makeLine(type, p1, p2);
            }
            pending = [];
            evaluateAll(); updatePanel(); draw();
        }

        function toolThreePoints(m, type) {
            if (pending.length < 3) {
                const p = getOrCreatePoint(m.sx, m.sy);
                if (pending.length && pending[pending.length - 1] === p) {
                    toast('不能连续点击同一个点'); return;
                }
                pending.push(p);
                evaluateAll(); draw();
                if (pending.length === 3) {
                    pushUndo();
                    const [A, B, C] = pending;
                    if (type === 'angle') {
                        const o = makeGeneric('angle', { a: A.id, b: B.id, c: C.id }, { color: COL.angle });
                        o.name = autoName('angle');
                        selectedId = o.id;
                    } else {
                        makeGeneric('angleBisector', { a: A.id, b: B.id, c: C.id }, { color: COL.derived });
                    }
                    pending = [];
                    evaluateAll(); updatePanel(); draw();
                }
            }
        }

        function toolIntersect(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit || hit.type === 'point' || hit.type === 'text' || hit.type === 'slider') {
                toast('请点击曲线或直线'); return;
            }
            if (pending.length === 0) { pending.push(hit); evaluateAll(); draw(); return; }
            const o1 = pending[0];
            if (o1 === hit) { toast('请点击两个不同对象'); return; }
            const pts = computeIntersections(o1.id, hit.id);
            if (!pts.length) { toast('没有交点'); pending = []; draw(); return; }
            pushUndo();
            pts.forEach((pt, i) => {
                const np = makePoint(pt.x, pt.y, {
                    free: false, parents: [o1.id, hit.id], rule: 'intersect', branch: i, color: '#d81b60'
                });
                np.showTrail = true;
            });
            pending = [];
            evaluateAll(); updatePanel(); draw();
            toast('已创建 ' + pts.length + ' 个交点（轨迹已开启）');
        }

        function toolLineAndPoint(m, type) {
            if (pending.length === 0) {
                const hit = hitTest(m.sx, m.sy);
                if (hit && (hit._p1 || ['segment', 'line', 'ray', 'vector', 'secant',
                    'perpBisector', 'perpendicular', 'parallel', 'angleBisector'].includes(hit.type))) {
                    pending.push(hit); evaluateAll(); draw();
                } else {
                    toast('请先点击一条直线或线段');
                }
                return;
            }
            const base = pending[0];
            const p = getOrCreatePoint(m.sx, m.sy);
            pushUndo();
            makeGeneric(type, { line: base.id, point: p.id },
                { color: type === 'perpendicular' ? '#00695c' : '#3f51b5' });
            pending = [];
            evaluateAll(); updatePanel(); draw();
        }

        function toolPolygon(m, dbl) {
            const nearFirst = pending.length >= 3 && findPointNear(m.sx, m.sy) === pending[0];
            if ((dbl && pending.length >= 3) || nearFirst) { finishPolygon(); return; }
            const p = getOrCreatePoint(m.sx, m.sy);
            if (pending.length && pending[pending.length - 1] === p) return;
            pending.push(p);
            evaluateAll(); draw();
        }
        function finishPolygon() {
            if (pending.length < 3) { toast('至少需要3个顶点'); return; }
            pushUndo();
            const poly = makePolygon(pending);
            selectedId = poly.id;
            pending = [];
            evaluateAll(); updatePanel(); draw();
            toast('多边形 ' + poly.name + ' 已创建');
        }

        /* ★ 外接圆工具：点击多边形 */
        function toolCircumcircle(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit || hit.type !== 'polygon') {
                toast('请点击一个多边形'); return;
            }
            if (hit._pts && hit._pts.length < 3) {
                toast('多边形至少 3 个顶点'); return;
            }
            // 检查前三点是否共线
            const A = hit._pts[0], B = hit._pts[1], C = hit._pts[2];
            const d = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
            if (Math.abs(d) < 1e-9) {
                toast('前三个顶点共线，无法确定外接圆'); return;
            }
            pushUndo();
            const c = makeCircle(null, null, {
                polygonId: hit.id, derived: 'circumcircle',
                color: COL.circumcircle, width: 2
            });
            c.name = autoName('circumcircle');
            selectedId = c.id;
            evaluateAll(); updatePanel(); draw();
            toast('外接圆 ' + c.name + ' 已创建（随多边形变化自动更新）');
        }

        /* ★ 内切圆工具：点击三角形 */
        function toolIncircle(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit || hit.type !== 'polygon') {
                toast('请点击一个三角形（3 顶点的多边形）'); return;
            }
            if (hit._pts && hit._pts.length !== 3) {
                toast('内切圆只支持三角形（当前多边形有 ' + (hit._pts ? hit._pts.length : 0) + ' 个顶点）');
                return;
            }
            const inc = computeIncircle(hit._pts);
            if (!inc) { toast('三点共线，无法确定内切圆'); return; }
            pushUndo();
            const c = makeCircle(null, null, {
                polygonId: hit.id, derived: 'incircle',
                color: COL.incircle, width: 2
            });
            c.name = autoName('incircle');
            selectedId = c.id;
            evaluateAll(); updatePanel(); draw();
            toast('内切圆 ' + c.name + ' 已创建 · 半径 r = ' + fmt(inc.r));
        }

        function toolTangent(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit) { toast('请点击曲线或圆'); return; }
            if (!['circle', 'ellipse', 'parabola', 'hyperbola', 'func'].includes(hit.type)) {
                toast('请点击圆、圆锥曲线或函数图像'); return;
            }
            let nearest = null, bestD = Infinity;
            const [wx, wy] = s2w(m.sx, m.sy);
            if (hit.type === 'circle' && hit._c) {
                const dx = wx - hit._c.x, dy = wy - hit._c.y;
                const d = Math.hypot(dx, dy);
                if (d > 1e-9) nearest = { x: hit._c.x + hit._r * dx / d, y: hit._c.y + hit._r * dy / d };
            } else if (hit.type === 'func' && hit._fn) {
                for (let sx = 0; sx <= W; sx += 2) {
                    const [wwx] = s2w(sx, 0);
                    let wyy;
                    try { wyy = hit._fn([wwx]); } catch (e) { continue; }
                    if (!isFinite(wyy)) continue;
                    const [ssx, ssy] = w2s(wwx, wyy);
                    const d = Math.hypot(ssx - m.sx, ssy - m.sy);
                    if (d < bestD) { bestD = d; nearest = { x: wwx, y: wyy }; }
                }
            } else if (hit._pts) {
                const pts = hit._pts.concat(hit._pts2 || []);
                for (const p of pts) {
                    const d = Math.hypot(p.x - wx, p.y - wy);
                    if (d < bestD) { bestD = d; nearest = p; }
                }
            }
            if (!nearest) { toast('无法确定切点'); return; }
            pushUndo();
            const P = makePoint(nearest.x, nearest.y, {
                free: false, pathId: hit.id, t: 0, color: '#00695c', size: 4.5, animating: false
            });
            P.name = autoName('point');
            if (hit._pts && hit._pts.length) {
                let bi = 0, bd = Infinity;
                for (let i = 0; i < hit._pts.length; i++) {
                    const d = (hit._pts[i].x - nearest.x) ** 2 + (hit._pts[i].y - nearest.y) ** 2;
                    if (d < bd) { bd = d; bi = i; }
                }
                P.t = bi / hit._pts.length;
            } else if (hit.type === 'circle' && hit._c) {
                P.t = (Math.atan2(nearest.y - hit._c.y, nearest.x - hit._c.x) / (Math.PI * 2) + 1) % 1;
            }
            computeObj(P);
            makeGeneric('tangent', { curve: hit.id, point: P.id }, { color: COL.tangent });
            evaluateAll(); updatePanel(); draw();
            toast('已创建切线与切点 ' + P.name);
        }

        function toolFunc(m) {
            const expr = prompt('输入函数表达式 f(x) =', 'x^2 / 3 - 1');
            if (!expr) return;
            const fn = compileFn(expr, ['x']);
            if (!fn) { toast('表达式无法解析'); return; }
            pushUndo();
            const o = makeGeneric('func', { expr, name: autoName('func') }, { color: COL.func });
            o._fn = fn;
            evaluateAll(); updatePanel(); draw();
            toast('函数 ' + o.name + '(x) = ' + expr + ' 已创建');
        }

        function toolEllipse(m) {
            if (pending.length < 3) {
                const p = getOrCreatePoint(m.sx, m.sy);
                if (pending.length && pending[pending.length - 1] === p) return;
                pending.push(p);
                evaluateAll(); draw();
                if (pending.length === 3) {
                    pushUndo();
                    const [F1, F2, P] = pending;
                    makeGeneric('ellipse', { f1: F1.id, f2: F2.id, through: P.id }, { color: COL.conic });
                    pending = [];
                    evaluateAll(); updatePanel(); draw();
                    toast('椭圆已创建');
                }
            }
        }
        function toolParabola(m) {
            if (pending.length < 2) {
                const p = getOrCreatePoint(m.sx, m.sy);
                if (pending.length && pending[pending.length - 1] === p) return;
                pending.push(p);
                evaluateAll(); draw();
                if (pending.length === 2) {
                    pushUndo();
                    const [V, F] = pending;
                    makeGeneric('parabola', { vertex: V.id, focus: F.id }, { color: COL.conic });
                    pending = [];
                    evaluateAll(); updatePanel(); draw();
                    toast('抛物线已创建');
                }
            }
        }
        function toolHyperbola(m) {
            if (pending.length < 3) {
                const p = getOrCreatePoint(m.sx, m.sy);
                if (pending.length && pending[pending.length - 1] === p) return;
                pending.push(p);
                evaluateAll(); draw();
                if (pending.length === 3) {
                    pushUndo();
                    const [F1, F2, P] = pending;
                    makeGeneric('hyperbola', { f1: F1.id, f2: F2.id, through: P.id }, { color: COL.conic });
                    pending = [];
                    evaluateAll(); updatePanel(); draw();
                    toast('双曲线已创建');
                }
            }
        }
        function toolText(m) {
            const [wx, wy] = s2w(m.sx, m.sy);
            const txt = prompt('输入文本内容：', '');
            if (!txt) return;
            pushUndo();
            const p = makePoint(wx, wy, { color: '#5f6368', size: 3 });
            p.labelVisible = false;
            objects.push({
                id: idSeq++, type: 'text', name: autoName('text'), point: p.id,
                text: txt, color: '#202124', fontSize: 14,
                visible: true, labelVisible: false, _x: wx, _y: wy
            });
            evaluateAll(); updatePanel(); draw();
        }
        function toolDelete(m) {
            const hit = hitTest(m.sx, m.sy);
            if (!hit) { toast('未点击到对象'); return; }
            pushUndo();
            const nm = hit.name;
            removeObject(hit.id);
            toast('已删除 ' + nm);
        }

        /* ==============================================================
           滑块交互
           ============================================================== */
        function sliderHit(o, sx, sy) {
            return sx >= o.x - 14 && sx <= o.x + 194 && sy >= o.y - 18 && sy <= o.y + 28;
        }
        function updateSlider(o, sx) {
            const ratio = clamp((sx - o.x) / 180, 0, 1);
            const nv = o.min + (o.max - o.min) * ratio;
            o.value = Math.round(nv / o.step) * o.step;
            if (o.value < o.min) o.value = o.min;
            if (o.value > o.max) o.value = o.max;
        }

        /* ==============================================================
           ★ 关键改进：拖动任意点
           ============================================================== */
        canvas.addEventListener('pointerdown', e => {
            if (e.button !== 0 && e.button !== 1) return;
            e.preventDefault();
            try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
            const r = canvas.getBoundingClientRect();
            const sx = e.clientX - r.left, sy = e.clientY - r.top;
            const [wx, wy] = s2w(sx, sy);
            mouse = { sx, sy, wx, wy };

            for (const o of objects) {
                if (o.type === 'slider' && o.visible && sliderHit(o, sx, sy)) {
                    pushUndo();
                    dragState = { mode: 'slider', obj: o };
                    updateSlider(o, sx);
                    evaluateAll(); recordAllTrails(); updatePanel(true); draw();
                    return;
                }
            }
            if (e.button === 1 || spaceDown) {
                dragState = { mode: 'pan', sx, sy, vx: view.x, vy: view.y };
                canvas.style.cursor = 'grabbing';
                return;
            }
            const tool = currentTool;

            if (tool === 'move') {
                const hit = hitTest(sx, sy);
                if (hit && hit.type === 'point') {
                    if (hit.free) {
                        /* 自由点：直接拖 */
                        pushUndo();
                        dragState = { mode: 'point', obj: hit, ox: hit.x - wx, oy: hit.y - wy };
                        selectedId = hit.id;
                        updatePanel(); draw();
                    } else if (hit.pathId != null) {
                        /* 路径上的动点：暂停运动 + 手动调 t */
                        pushUndo();
                        dragState = { mode: 'onPath', obj: hit, wasAnimating: hit.animating };
                        hit.animating = false;   // 手动拖动时暂停自动运动
                        const t = closestTOnPath(getObj(hit.pathId), wx, wy);
                        if (t != null) hit.t = t;
                        selectedId = hit.id;
                        evaluateAll(); recordAllTrails();
                        updatePanel(); draw();
                    } else {
                        /* 从动点：无法直接拖 */
                        selectedId = hit.id;
                        toast(hit.name + ' 由其他对象决定，无法直接拖动');
                        updatePanel(); draw();
                    }
                } else if (hit) {
                    selectedId = hit.id;
                    updatePanel(); draw();
                } else {
                    selectedId = null;
                    dragState = { mode: 'pan', sx, sy, vx: view.x, vy: view.y };
                    updatePanel(); draw();
                }
                return;
            }

            switch (tool) {
                case 'point': toolPoint({ sx, sy }); break;
                case 'animPoint': toolAnimPoint({ sx, sy }); break;
                case 'trace': toolTrace({ sx, sy }); break;
                case 'locus': toolLocus({ sx, sy }); break;
                case 'segment': toolTwoPoints({ sx, sy }, 'segment'); break;
                case 'line': toolTwoPoints({ sx, sy }, 'line'); break;
                case 'ray': toolTwoPoints({ sx, sy }, 'ray'); break;
                case 'vector': toolTwoPoints({ sx, sy }, 'vector'); break;
                case 'secant': toolTwoPoints({ sx, sy }, 'secant'); break;
                case 'circle': toolTwoPoints({ sx, sy }, 'circle'); break;
                case 'midpoint': toolTwoPoints({ sx, sy }, 'midpoint'); break;
                case 'nDivi': toolTwoPoints({ sx, sy }, 'nDivi'); break;
                case 'perpBisector': toolTwoPoints({ sx, sy }, 'perpBisector'); break;
                case 'distance': toolTwoPoints({ sx, sy }, 'distance'); break;
                case 'angle': toolThreePoints({ sx, sy }, 'angle'); break;
                case 'angleBisector': toolThreePoints({ sx, sy }, 'angleBisector'); break;
                case 'intersect': toolIntersect({ sx, sy }); break;
                case 'perpendicular': toolLineAndPoint({ sx, sy }, 'perpendicular'); break;
                case 'parallel': toolLineAndPoint({ sx, sy }, 'parallel'); break;
                case 'polygon': toolPolygon({ sx, sy }, false); break;
                case 'circumcircle': toolCircumcircle({ sx, sy }); break;
                case 'incircle': toolIncircle({ sx, sy }); break;
                case 'tangent': toolTangent({ sx, sy }); break;
                case 'func': toolFunc({ sx, sy }); break;
                case 'ellipse': toolEllipse({ sx, sy }); break;
                case 'parabola': toolParabola({ sx, sy }); break;
                case 'hyperbola': toolHyperbola({ sx, sy }); break;
                case 'text': toolText({ sx, sy }); break;
                case 'delete': toolDelete({ sx, sy }); break;
            }
        });

        canvas.addEventListener('pointermove', e => {
            const r = canvas.getBoundingClientRect();
            const sx = e.clientX - r.left, sy = e.clientY - r.top;
            const [wx, wy] = s2w(sx, sy);
            mouse = { sx, sy, wx, wy };
            coordsEl.textContent = `(${fmt(wx)}, ${fmt(wy)})`;

            if (dragState) {
                if (dragState.mode === 'point') {
                    const o = dragState.obj;
                    o.x = wx + dragState.ox;
                    o.y = wy + dragState.oy;
                    evaluateAll();
                    recordAllTrails();
                    updatePanel(true);
                    draw();
                } else if (dragState.mode === 'onPath') {
                    /* ★ 拖动路径动点：反求 t */
                    const o = dragState.obj;
                    const t = closestTOnPath(getObj(o.pathId), wx, wy);
                    if (t != null) o.t = t;
                    evaluateAll();
                    recordAllTrails();
                    updatePanel(true);
                    draw();
                } else if (dragState.mode === 'pan') {
                    view.x = dragState.vx - (sx - dragState.sx) / view.scale;
                    view.y = dragState.vy + (sy - dragState.sy) / view.scale;
                    draw();
                } else if (dragState.mode === 'slider') {
                    updateSlider(dragState.obj, sx);
                    evaluateAll();
                    recordAllTrails();
                    updatePanel(true);
                    draw();
                }
                return;
            }

            const h = hitTest(sx, sy);
            const nh = h ? h.id : null;
            if (nh !== hoverId) { hoverId = nh; draw(); }

            if (currentTool === 'move') {
                if (h && h.type === 'point' && h.free) canvas.style.cursor = 'grab';
                else if (h && h.type === 'point' && h.pathId != null) canvas.style.cursor = 'move';
                else if (h) canvas.style.cursor = 'pointer';
                else canvas.style.cursor = 'default';
            } else if (currentTool === 'delete') {
                canvas.style.cursor = h ? 'pointer' : 'default';
            } else if (h && h.type === 'slider') {
                canvas.style.cursor = 'ew-resize';
            } else {
                canvas.style.cursor = 'crosshair';
            }
            if (pending.length) draw();
        });

        canvas.addEventListener('pointerup', () => {
            if (dragState) {
                if (dragState.mode === 'point' || dragState.mode === 'onPath' || dragState.mode === 'slider') {
                    evaluateAll(); updatePanel(); draw();
                }
                dragState = null;
                canvas.style.cursor = (currentTool === 'move') ? 'default' : 'crosshair';
            }
        });
        canvas.addEventListener('pointercancel', () => { dragState = null; });
        canvas.addEventListener('dblclick', () => {
            if (currentTool === 'polygon' && pending.length >= 3) finishPolygon();
        });
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const r = canvas.getBoundingClientRect();
            const sx = e.clientX - r.left, sy = e.clientY - r.top;
            const [wx, wy] = s2w(sx, sy);
            const f = Math.exp(-e.deltaY * 0.0015);
            view.scale = clamp(view.scale * f, 3, 1600);
            view.x = wx - (sx - W / 2) / view.scale;
            view.y = wy + (sy - H / 2) / view.scale;
            draw();
        }, { passive: false });
        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            pending = [];
            if (selectedId != null) { selectedId = null; updatePanel(); }
            draw();
        });

        /* ==============================================================
           播放控制条
           ============================================================== */
        const btnPlay = document.getElementById('btnPlay');
        const icPlay = document.getElementById('icPlay');
        const icPause = document.getElementById('icPause');
        function setPlayUI() {
            if (anim.playing) {
                btnPlay.classList.remove('paused');
                icPlay.style.display = 'none';
                icPause.style.display = '';
                btnPlay.title = '暂停 (空格)';
            } else {
                btnPlay.classList.add('paused');
                icPlay.style.display = '';
                icPause.style.display = 'none';
                btnPlay.title = '播放 (空格)';
            }
        }
        btnPlay.addEventListener('click', () => {
            anim.playing = !anim.playing;
            setPlayUI();
            toast(anim.playing ? '动画播放中' : '动画已暂停');
        });
        document.getElementById('btnBack').addEventListener('click', () => {
            anim.speed = Math.max(0.1, anim.speed - 0.25);
            spdLbl.textContent = anim.speed.toFixed(2).replace(/0$/, '') + '×';
        });
        document.getElementById('btnFwd').addEventListener('click', () => {
            anim.speed = Math.min(6, anim.speed + 0.25);
            spdLbl.textContent = anim.speed.toFixed(2).replace(/0$/, '') + '×';
        });
        document.getElementById('dirSel').addEventListener('change', e => {
            const v = parseInt(e.target.value, 10);
            anim.direction = v;
            for (const o of objects) {
                if (o.type === 'point' && o.animating && o.pathId != null) {
                    o.direction = (v === 2) ? 2 : v;
                    if (v === 2) o.bounceDir = 1;
                }
            }
            toast(v === 1 ? '正方向运动' : v === -1 ? '反方向运动' : '往复运动');
        });
        document.getElementById('btnClearTrails').addEventListener('click', () => {
            for (const o of objects) if (o.type === 'point') o.trail = [];
            draw();
            toast('已清除所有轨迹');
        });

        /* ==============================================================
           面板
           ============================================================== */
        function typeColor(o) {
            if (o.type === 'point') return o.color;
            if (o.type === 'angle' || o.type === 'distance') return '#d93025';
            return o.color || '#5f6368';
        }
        function describe(o) {
            switch (o.type) {
                case 'point': {
                    if (o.pathId != null) {
                        const p = getObj(o.pathId);
                        return `路径点 · t=${fmt(o.t, 3)} (在 ${p ? p.name : '?'} 上)` + (o.animating ? ' · 运动中' : '');
                    }
                    if (o.rule === 'midpoint') return `中点 = (${fmt(o.x)}, ${fmt(o.y)})`;
                    if (o.rule === 'intersect') return `交点 = (${fmt(o.x)}, ${fmt(o.y)})`;
                    if (o.rule === 'expr') return `从动点 = (${fmt(o.x)}, ${fmt(o.y)})`;
                    if (o.rule === 'incircleCenter') return `内心`;
                    if (o.rule === 'circumcircleCenter') return `外心`;
                    return `(${fmt(o.x)}, ${fmt(o.y)})`;
                }
                case 'segment': {
                    const A = getPt(o.a), B = getPt(o.b);
                    if (!A || !B) return '线段';
                    return `${A.name}${B.name} = ${fmt(Math.hypot(B.x - A.x, B.y - A.y))}`;
                }
                case 'line': {
                    const A = getPt(o.a), B = getPt(o.b);
                    if (!A || !B) return '直线';
                    const dx = B.x - A.x, dy = B.y - A.y;
                    if (Math.abs(dx) < 1e-9) return `x = ${fmt(A.x)}`;
                    const m = dy / dx, c = A.y - m * A.x;
                    return `y = ${fmt(m)}x ${c >= 0 ? '+' : '−'} ${fmt(Math.abs(c))}`;
                }
                case 'ray': return `射线 ${getPt(o.a)?.name || '?'}${getPt(o.b)?.name || '?'}`;
                case 'vector': return `向量 ${getPt(o.a)?.name || '?'}${getPt(o.b)?.name || '?'}`;
                case 'secant': return `割线 ${getPt(o.a)?.name || '?'}${getPt(o.b)?.name || '?'}`;
                case 'circle': {
                    if (o.derived === 'incircle') {
                        const poly = getObj(o.polygonId);
                        return `内切圆 of ${poly ? poly.name : '?'} · r=${fmt(o._r || 0)}`;
                    }
                    if (o.derived === 'circumcircle') {
                        const poly = getObj(o.polygonId);
                        return `外接圆 of ${poly ? poly.name : '?'} · r=${fmt(o._r || 0)}`;
                    }
                    const C = getPt(o.center);
                    if (!C) return '圆';
                    if (o.through != null) {
                        const T = getPt(o.through);
                        return `圆(${C.name}, ${T ? T.name : '?'}) · r=${fmt(o._r || 0)}`;
                    }
                    return `圆(${C.name}, ${fmt(o.radius || 0)})`;
                }
                case 'polygon': {
                    const pts = o.pts.map(getPt).filter(Boolean);
                    return `${pts.map(p => p.name).join('')} · 面积 ${fmt(o._pts ? polyArea(o._pts) : 0)}`;
                }
                case 'ellipse':
                    if (!o._a) return '椭圆';
                    return `椭圆 · a=${fmt(o._a)} b=${fmt(o._b)}`;
                case 'parabola':
                    if (!o._p) return '抛物线';
                    return `抛物线 · p=${fmt(o._p)}`;
                case 'hyperbola':
                    if (!o._a) return '双曲线';
                    return `双曲线 · a=${fmt(o._a)} b=${fmt(o._b)}`;
                case 'func': return `f(x) = ${o.expr}`;
                case 'tangent': return '切线';
                case 'locus': {
                    const P = getPt(o.point);
                    return `轨迹 of ${P ? P.name : '?'} · ${o._samples ? o._samples.length : 0} 点`;
                }
                case 'slider': return `参数 = ${fmt(o.value)}`;
                case 'angle': return `∠ = ${fmtAngle(Math.abs(o._angle || 0))}`;
                case 'distance': return `距离 = ${fmt(o._len)}`;
                case 'perpBisector': {
                    const A = getPt(o.a), B = getPt(o.b);
                    return `${A ? A.name : '?'}${B ? B.name : '?'} 的垂直平分线`;
                }
                case 'angleBisector': {
                    const A = getPt(o.a), B = getPt(o.b), C = getPt(o.c);
                    return `∠${A ? A.name : '?'}${B ? B.name : '?'}${C ? C.name : '?'} 的角平分线`;
                }
                case 'perpendicular': return '垂线';
                case 'parallel': return '平行线';
                case 'text': return String(o.text || '').slice(0, 30);
                default: return '';
            }
        }
        function updatePanel(listOnly) {
            listArea.innerHTML = '';
            if (!objects.length) {
                listArea.innerHTML = '<div class="empty"><b>◫</b>暂无可显示的对象<br>用左侧工具或输入框开始作图</div>';
                objCountEl.textContent = '0 个对象';
                if (!listOnly) renderStyle();
                return;
            }
            const frag = document.createDocumentFragment();
            for (const o of objects) {
                const row = document.createElement('div');
                row.className = 'objRow' + (o.id === selectedId ? ' sel' : '') + (o.visible ? '' : ' hide');
                const dot = document.createElement('div');
                dot.className = 'objDot';
                let cls = '';
                if (o.type === 'point') {
                    if (o.animating && o.pathId != null) cls = 'anim';
                    else if (o.showTrail) cls = 'trail';
                } else cls = 'sq';
                dot.innerHTML = `<i class="${cls}" style="background:${typeColor(o)}"></i>`;
                dot.title = o.visible ? '隐藏' : '显示';
                dot.addEventListener('click', ev => {
                    ev.stopPropagation();
                    pushUndo();
                    o.visible = !o.visible;
                    updatePanel(); draw();
                });
                const nm = document.createElement('span');
                nm.className = 'objName';
                nm.textContent = o.name;
                const df = document.createElement('span');
                df.className = 'objDef';
                df.textContent = describe(o) + (o.type === 'point' && o.showTrail ? '  ●轨迹' : '');
                row.appendChild(dot); row.appendChild(nm); row.appendChild(df);
                row.addEventListener('click', () => {
                    selectedId = (selectedId === o.id) ? null : o.id;
                    updatePanel(); draw();
                });
                frag.appendChild(row);
            }
            listArea.appendChild(frag);
            objCountEl.textContent = objects.length + ' 个对象';
            if (!listOnly) renderStyle();
        }
        function renderStyle() {

                sl.addEventListener('input', () => { o.width = parseInt(sl.value, 10); draw(); });
                row2.appendChild(sl);
                styleBody.appendChild(row2);
            }

            if (o.type === 'point' && o.pathId != null) {
                const rowS = document.createElement('div');
                rowS.className = 'styleRow';
                rowS.innerHTML = '<span class="styleLbl">速度</span>';
                const sl = document.createElement('input');
                sl.type = 'range'; sl.min = '0.2'; sl.max = '4'; sl.step = '0.1';
                sl.className = 'slider'; sl.value = o.animSpeed || 1;
                sl.addEventListener('input', () => { o.animSpeed = parseFloat(sl.value); });
                rowS.appendChild(sl);
                styleBody.appendChild(rowS);

                const rowD = document.createElement('div');
                rowD.className = 'styleRow';
                rowD.innerHTML = '<span class="styleLbl">方向</span>';
                const wrapD = document.createElement('div');
                wrapD.style.cssText = 'display:flex;gap:4px;flex:1';
                [['正向', 1], ['反向', -1], ['往复', 2]].forEach(([lab, v]) => {
                    const b = document.createElement('button');
                    b.className = 'btnMini' + ((o.direction === v) ? ' on' : '');

                rowD.appendChild(wrapD);

                const rowR = document.createElement('div');
                rowR.className = 'styleRow';

                sl2.type = 'range'; sl2.min = '0'; sl2.max = '1'; sl2.step = '0.005';
                sl2.className = 'slider'; sl2.value = o.t;
                sl2.addEventListener('input', () => {
                    o.t = parseFloat(sl2.value);

                    evaluateAll(); recordAllTrails(); draw();

                rowR.appendChild(sl2);

                rowPlay.className = 'styleRow';

        function parsePointLiteral(s) {
            const m = s.match(/^\(\s*(-?[\d.]+)\s*[,;]\s*(-?[\d.]+)\s*\)$/);
            if (!m) return null;
            return { x: parseFloat(m[1]), y: parseFloat(m[2]) };

        function executeCommand(raw) {
            const input = raw.trim();

            const eq = input.indexOf('=');

                const rhs = input.slice(eq + 1).trim();
                const fm = lhs.match(/^([A-Za-z][A-Za-z0-9_]*)\s*\(\s*([A-Za-z])\s*\)$/);
                if (fm) {
                    const fname = fm[1], varName = fm[2];
                    const fn = compileFn(rhs, [varName]);
                    if (!fn) { toast('表达式无法解析'); return; }
                    pushUndo();
                    const ex = objects.find(o => o.name === fname && o.type === 'func');
                    if (ex) { ex.expr = rhs; ex._fn = fn; }
                    else {
                        const o = makeGeneric('func', { expr: rhs, name: fname }, { color: COL.func });
                        o._fn = fn;
                    }
                    evaluateAll(); updatePanel(); draw();
                    toast(`函数 ${fname}(x) = ${rhs} 已创建`);
                    return;
                }
                const pt = parsePointLiteral(rhs);
                if (pt && /^[A-Za-z][A-Za-z0-9_]*$/.test(lhs)) {
                    pushUndo();
                    const existing = objects.find(o => o.name === lhs && o.type === 'point');
                    if (existing) { existing.x = pt.x; existing.y = pt.y; existing.free = true; existing.pathId = null; }
                    else makePoint(pt.x, pt.y, { name: lhs });
                    evaluateAll(); updatePanel(); draw();
                    toast(`点 ${lhs} 已创建`);
                    return;
                }
            }

            const m = input.match(/^([A-Za-z\u4e00-\u9fa5]+)\s*[\(（](.*)[\)）]\s*$/);
            if (!m) { toast('无法识别的命令'); return; }
            let cmd = m[1];
            const args = m[2].split(/[,，]/).map(s => s.trim()).filter(Boolean);
            const alias = {
                '点': 'Point', '坐标': 'Point', '线段': 'Segment', '直线': 'Line', '射线': 'Ray',
                '向量': 'Vector', '圆': 'Circle', '多边形': 'Polygon', '中点': 'Midpoint',
                '交点': 'Intersect', '垂线': 'Perp', '平行线': 'Para', '垂直平分线': 'PerpBis',
                '角平分线': 'AngBis', '角度': 'Angle', '距离': 'Distance', '切线': 'Tangent',
                '函数': 'Function', '椭圆': 'Ellipse', '抛物线': 'Parabola', '双曲线': 'Hyperbola',
                '轨迹': 'Locus', '动点': 'AnimPoint', '追踪': 'Trace', '滑块': 'Slider', '文本': 'Text',
                '内切圆': 'Incircle', '外接圆': 'Circumcircle'
            };
            cmd = alias[cmd] || cmd;

            const resolve = (s) => {
                if (!s) return null;
                const pp = parsePointLiteral(s);
                if (pp) {
                    const x = parseFloat(pp.x), y = parseFloat(pp.y);
                    for (const o of objects) if (o.type === 'point' && Math.abs(o.x - x) < 1e-9 && Math.abs(o.y - y) < 1e-9) return o;
                    return makePoint(x, y);

        let toastTimer = null;
        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
        }
        function resetView() { view.x = 0; view.y = 0; view.scale = 64; draw(); }
        function fitView() {
            const pts = objects.filter(o => o.type === 'point' && o.valid !== false);
            if (!pts.length) { resetView(); return; }
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const p of pts) {
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
            }
            const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            const w = Math.max(maxX - minX, 2), h = Math.max(maxY - minY, 2);
            view.scale = clamp(Math.min(W / (w * 1.4), H / (h * 1.4)), 4, 900);
            view.x = cx; view.y = cy;
            draw();
        }

        window.addEventListener('keydown', e => {
            const tag = (e.target && e.target.tagName) || '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

            if (e.code === 'Space' && (e.target === document.body || e.target === canvas)) {
                e.preventDefault();

                setPlayUI();
                toast(anim.playing ? '动画播放中' : '动画已暂停');

            if (e.code === 'Space' && !spaceDown) {

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();

                '6': 'segment', '7': 'line', '8': 'ray', '9': 'vector',

            if (map[e.key]) { setTool(map[e.key]); return; }

            const TB = makePoint(-1.5, -3, { name: 'T₂' });
            const TC = makePoint(-2.8, -0.6, { name: 'T₃' });
            const tri = makePolygon([TA, TB, TC], { color: '#e8710a' });
            tri.name = '△ABC';

            /* 9. 三角形外接圆 */
            const circum = makeCircle(null, null, {
                polygonId: tri.id, derived: 'circumcircle',
                color: COL.circumcircle, width: 2
            });
            circum.name = '外接圆';

            /* 10. 三角形内切圆 */
            const inCircle = makeCircle(null, null, {
                polygonId: tri.id, derived: 'incircle',
                color: COL.incircle, width: 2
            });
            inCircle.name = '内切圆';

            /* 11. 滑块 t（用于演示轨迹线） */
            const t1 = {
                id: idSeq++, type: 'slider', name: 't', value: 0.5, min: -3, max: 3, step: 0.02,
                x: 60, y: 70, color: COL.slider, width: 2, visible: true, labelVisible: true
            };
            objects.push(t1);

            /* 12. 从动点 R 由滑块 t 驱动，用"轨迹线"生成完整轨迹 */
            const R = makePoint(0, 0, {
                free: false, rule: 'expr', color: '#00695c', size: 5,
                showTrail: false
            });
            R.name = 'R';
            R._fx = () => t1.value;
            R._fy = () => t1.value * t1.value / 3 - 1;
            R.parents = [t1.id];

            /* 13. 轨迹线 */
            const loc = makeGeneric('locus', { point: R.id, driver: t1.id }, { color: COL.locus });
            computeLocus(loc);

            evaluateAll();
            updatePanel();
            setTool('move');
            setPlayUI();
            startAnimLoop();
            draw();
        }

        init();
    </script>
</body>

</html>
