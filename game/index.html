<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏大厅 - Chaison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(25, 25, 35, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 32px 36px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #f0f0f5;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* 长条式按钮列表 */
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e0e0ea;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-item:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-color: transparent;
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.25);
        }

        .game-item .icon {
            font-size: 24px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .game-item .name {
            flex: 1;
            text-align: left;
        }

        .game-item .arrow {
            font-size: 18px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .game-item:hover .arrow {
            opacity: 1;
        }

        /* 返回主页链接 */
        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #a8b2ff;
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
        }

        .footer a:hover {
            color: #a8b2ff;
        }

        /* 手机适配 */
        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .game-item {
                padding: 14px 18px;
                font-size: 15px;
            }

            .game-item .icon {
                font-size: 20px;
                margin-right: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎮 游戏大厅</h1>
        <div class="subtitle">选择你想玩的游戏</div>

        <div class="game-list">
            <!-- 扫雷（已修正为绝对路径） -->
            <a href="/game/thunder/" class="game-item">
                <span class="icon">💣</span>
                <span class="name">扫雷</span>
                <span class="arrow">→</span>
            </a>

            <!-- 你画我猜（占位，后续可替换真实链接） -->
            <a href="#" class="game-item" onclick="alert('你画我猜 即将上线，敬请期待！')">
                <span class="icon">🎨</span>
                <span class="name">你画我猜</span>
                <span class="arrow">→</span>
            </a>

            <!-- 五子棋（占位） -->
            <a href="#" class="game-item" onclick="alert('五子棋 即将上线，敬请期待！')">
                <span class="icon">⚫</span>
                <span class="name">五子棋</span>
                <span class="arrow">→</span>
            </a>

            <!-- 中国象棋（占位） -->
            <a href="#" class="game-item" onclick="alert('中国象棋 即将上线，敬请期待！')">
                <span class="icon">♟️</span>
                <span class="name">中国象棋</span>
                <span class="arrow">→</span>
            </a>

            <!-- 更多游戏 → 跳转到 Poki -->
            <a href="https://poki.com" class="game-item" target="_blank">
                <span class="icon">➕</span>
                <span class="name">更多游戏</span>
                <span class="arrow">→</span>
            </a>
        </div>

        <a href="https://chaison2026.github.io" class="back-link">← 返回主页</a>
    </div>

    <div class="footer">
        <a href="https://chaison2026.github.io" target="_blank">Chaison</a> · 游戏大厅
    </div>
</body>

</html>
